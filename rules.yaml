# Redaction rules for API traffic logs.
version: 1

settings:
  mask:    { replacement: "****" }
  partial: { keep_last: 4, fill: "*" }
  hash:    { algorithm: sha256 }

# key_rules match on the NAME of a JSON key or HTTP header.
#   scope: headers | body | any
#   match: either { exact: [names...] } or { regex: "..." }
#   preserve_scheme (optional): keep a leading auth scheme such as "Bearer"
#     and redact only the credential after it.
key_rules:
  - name: auth-headers
    scope: headers
    match:
      exact: [Authorization, Proxy-Authorization, X-Auth-Token, Cookie, Set-Cookie]
    action: mask
    preserve_scheme: true

  - name: api-key-names
    scope: any
    match:
      regex: '(?i)^(x-)?api[_-]?key$'
    action: hash

  # Any other header whose name says it carries a credential: X-Access-Token,
  # X-CSRF-Token, X-Amz-Security-Token, X-Session-Id, X-Goog-Api-Key,
  # X-Authorization, X-Forwarded-Authorization, X-Cookie, ...
  # A name that only looks like one costs little; a missed credential leaks.
  # It comes after api-key-names, so X-Api-Key is still hashed.
  - name: credential-headers
    scope: headers
    match:
      regex: '(?i)(auth|cookie|csrf|xsrf|token|secret|session|passw(?:or)?d|pwd|passphrase|credential|signature|private[_-]?key|api[_-]?key)'
    action: mask

  # A field whose name ENDS with one of these words: password, newPassword,
  # db_password, access_token, csrfToken, secretAccessKey, sessionId,
  # authorization, cookie, ... Matching the end keeps look-alikes out:
  # password_hint, passwordless, tokenizer, token_type and secret_santa do
  # not end with a secret word. ("session" alone is left out here, so a
  # whole session object with harmless fields is not masked; the text rules
  # below do include it.)
  - name: secret-fields
    scope: body
    match:
      regex: '(?i)(?:password|passwd|pwd|passphrase|secret|token|api[_-]?key|access[_-]?key|secret[_-]?key|private[_-]?key|credentials?|session[_-]?id|authorization|cookie|auth)$'
    action: mask

  - name: card-number-fields
    scope: body
    match:
      regex: '(?i)^(card_?number|pan)$'
    action: partial

  - name: cvv-fields
    scope: body
    match:
      regex: '(?i)^(cvv|cvc|cvv2)$'
    action: remove

  # Personal data. Hashed rather than masked: the same phone number showing
  # up on many accounts is a fraud signal, and a hash keeps that visible.
  - name: pii-fields
    scope: body
    match:
      regex: '(?i)^(ssn|social_security_number|phone|phone_number|mobile|dob|date_of_birth|birth_date)$'
    action: hash

# value_rules match on the CONTENT of any string value, whatever its key is called.
#   validator (optional): the match only counts if the validator accepts it. Supported: luhn
#   group (optional): redact only this capture group of the match, not all of
#     it. With alternatives, the first group from this one on that took part.
value_rules:
  # Also percent-encoded (%40 for @), as in a URL or form written as text:
  # "contact bob%40example.com". In a parsed form or query string the value
  # is decoded first, so there the plain form matches.
  # Letters and digits in any script, so international domains match too
  # (user@exämple.com). "_" is not allowed in a host name, so
  # name@exa_mple.com (listed as a non-email in the sample input) is kept.
  - name: email
    pattern: '[\p{L}\p{N}._%+-]+(?:@|%40)[\p{L}\p{N}.-]+\.\p{L}{2,}'
    action: hash

  # JWTs are base64url (RFC 7515): "-" and "_", not "+" and "/". Both
  # alphabets are accepted so that non-standard tokens are caught too.
  # 2 to 5 segments: a signed JWT has 3, an encrypted one (JWE) has 5.
  - name: jwt
    pattern: 'eyJ[A-Za-z0-9_+/=-]+(?:\.[A-Za-z0-9_+/=-]+){1,4}'
    action: mask

  # 13 to 19 digits, optionally grouped with single spaces or dashes
  # ("4111 1111 1111 1111", "5555-5555-5555-4444"). Luhn runs on the digits.
  - name: credit-card
    pattern: '\b\d(?:[ -]?\d){12,18}\b'
    validator: luhn
    action: partial

  # Tokens with a well-known format: Stripe secret, restricted and webhook
  # keys, OpenAI and Anthropic keys, GitHub, GitLab, Slack, Google API keys
  # and AWS access key ids.
  - name: api-key-prefix
    pattern: '\b(?:(?:sk|rk)_(?:live|test)_[A-Za-z0-9]+|whsec_[A-Za-z0-9]{20,}|sk-(?:proj|ant|svcacct|admin)-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{36,255}|github_pat_[A-Za-z0-9_]{22,255}|glpat-[A-Za-z0-9_-]{20,}|xox[abposr]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{35}|(?:AKIA|ASIA)[0-9A-Z]{16})\b'
    action: mask

  # A password inside a URL: scheme://user:password@host. Only the password
  # is masked.
  - name: url-credentials
    pattern: '(?i)\b[a-z][a-z0-9+.-]*://[^/\s:@"]*:([^/\s@"]+)@'
    group: 1
    action: mask

  # A PEM or PGP private key block, start to end; a block cut off before its
  # END line is masked to the end of the text.
  - name: pem-private-key
    pattern: '-----BEGIN[A-Z ]*PRIVATE KEY(?: BLOCK)?-----(?:[\s\S]*?-----END[A-Z ]*PRIVATE KEY(?: BLOCK)?-----|[\s\S]*)'
    action: mask

  # A bearer token written in text ("forwarded Bearer abc123..."). The word
  # Bearer stays.
  - name: bearer-token
    pattern: '(?i)\bbearer\s+([A-Za-z0-9._~+/=-]{8,})'
    group: 1
    action: mask

  # Authorization and Cookie headers written as text, as in a raw HTTP
  # request copied into a log. The auth scheme stays, the rest of the line
  # is masked.
  - name: http-header-dump
    pattern: '(?i)\b(?:(?:proxy-)?authorization\s*:\s*(?:(?:Bearer|Basic|Digest|Token|Negotiate)\s+)?|(?:set-)?cookie\s*:\s*)([^\r\n"]+)'
    group: 1
    action: mask

  # The rules below find a secret by the name written next to it, in text
  # the JSON parser did not open. "group: 1" masks only the value, so the
  # name stays visible ("password=****"). They use the same list of name
  # endings as secret-fields, plus "session"; [\w-]*? before it allows any
  # prefix (db_password, newPassword, x-api-key). TestGeneratedLeakCorpus
  # checks every spelling in every one of these places, so the copies cannot
  # drift apart unnoticed.

  # name=value or name: value in free text, e.g. a debug log line
  # "login attempt password=hunter2". The value may be quoted
  # (password: "my pass"); the quotes stay. An auth scheme before the value
  # is kept: "token: Bearer abc" becomes "token: Bearer ****".
  - name: secret-assignment
    pattern: '(?i)\b[\w-]*?(?:password|passwd|pwd|passphrase|secret|token|api[_-]?key|access[_-]?key|secret[_-]?key|private[_-]?key|credentials?|session[_-]?id|authorization|cookie|auth|session)\s*[=:]\s*(?:(?:Bearer|Basic|Token)\s+)?(?:"([^"]*)"|''([^'']*)''|([^\s&,;"''<]+))'
    group: 1
    action: mask

  # "password":"value" (or a number) in text: broken JSON, or JSON nested
  # too deep in strings to be parsed, where the quotes are escaped
  # (\"password\").
  - name: json-secret
    pattern: '(?i)\\*"[\w-]*?(?:password|passwd|pwd|passphrase|secret|token|api[_-]?key|access[_-]?key|secret[_-]?key|private[_-]?key|credentials?|session[_-]?id|authorization|cookie|auth|session)\\*"\s*:\s*(?:\\*"([^"\\]*)|(-?\d[\d.eE+-]*|true|false))'
    group: 1
    action: mask

  # <password>value</password> in an XML body.
  - name: xml-secret
    pattern: '(?i)<(?:[\w.-]+:)?[\w-]*?(?:password|passwd|pwd|passphrase|secret|token|api[_-]?key|access[_-]?key|secret[_-]?key|private[_-]?key|credentials?|session[_-]?id|authorization|cookie|auth|session)(?:\s[^>]*)?>([^<]+)<'
    group: 1
    action: mask

  # The value of a multipart/form-data field named like a secret:
  #   Content-Disposition: form-data; name="password"
  #   (blank line)
  #   hunter2
  - name: multipart-secret
    pattern: '(?i)name="[\w-]*?(?:password|passwd|pwd|passphrase|secret|token|api[_-]?key|access[_-]?key|secret[_-]?key|private[_-]?key|credentials?|session[_-]?id|authorization|cookie|auth|session)"[^\r\n]*(?:\r?\n[^\r\n]+)*\r?\n\r?\n([^\r\n]+)'
    group: 1
    action: mask
